<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Project Wingman (Projeto Wingman)</h1>
      <img
        class="img-inicio"
        src="assets/project_wingman.jpg"
        alt="Imagem do jogo Project Wingman"
      />
    </header>
    <nav>
      <a href="index.html">Início</a>
      <a href="historia.html">História</a>
      <a href="curiosidades.html">Curiosidades</a>
      <a href="musicas.html">Músicas</a>
    </nav>

    <main id="formulario">
      <form>
        <label for="avaliacao-de-jogo">Gostou do jogo?</label>
        <input
          type="checkbox"
          id="avaliacao-de-jogo"
          name="avaliacao-de-jogo"
        />
        <button type="submit">Enviar</button>
        <br />

        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          required
        />
        <button type="submit">Enviar</button>
      </form>
      <br />

      <label for="email">E-mail:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        required
      />
      <button type="submit">Enviar</button>
      <br />

      <textarea
        name="comentarios"
        id="comentarios"
        cols="30"
        rows="10"
        placeholder="Deixe seus comentários sobre o site aqui!"
        required
      ></textarea>
      <button type="submit">Enviar</button>
    </main>
  </body>
</html>
