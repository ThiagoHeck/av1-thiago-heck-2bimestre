  <body>
    <header>
      <h1>Project Wingman (Projeto Wingman)</h1>
      <img
        class="img-inicio"
        src="assets/project_wingman.jpg"
        alt="Imagem do jogo Project Wingman"
      />

    <nav>
      <a href="index.html">Início</a>

    <div class="formulario">
      <main>
        <form>
          <label for="avaliacao-de-jogo">Gostou do jogo?</label>
          <input
            type="checkbox"
            id="avaliacao-de-jogo"
            name="avaliacao-de-jogo"
          >Sim</input>
          <input
            type="checkbox"
            id="avaliacao-de-jogo"
            name="avaliacao-de-jogo"
          >Não</input>

          <label for="nome">Nome:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome"
            required
          />
          <label for="email">E-mail:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            required
          />
          <textarea
            name="comentarios"
            id="comentarios"
            cols="30"
            rows="10"
            placeholder="Deixe seus comentários sobre o site aqui!"
            required
          ></textarea>
          <button type="submit">Enviar</button>
        </form>
      </main>
    </div>
  </body>
